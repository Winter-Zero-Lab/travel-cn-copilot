services:
  - type: web
    name: travel-cn-copilot
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      # Secret — set this value in the Render dashboard, never in git.
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: "https://www.micuapi.ai/v1"
      - key: LLM_MODEL
        value: "glm-5.3-flash"
      - key: LLM_TIMEOUT
        value: "60"
